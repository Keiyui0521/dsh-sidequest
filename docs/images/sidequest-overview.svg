<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">SideQuest: follow your curiosity, keep your main thread</title><desc id="desc">Illustrated interface showing a main conversation, a side question, a deeper side question with an interactive chart, and an invitation to keep branching. This is a feature illustration, not a screenshot.</desc><rect x="0" y="0" width="1440" height="850" rx="0" fill="#f1f5f9" stroke="none"/><text x="60" y="66" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#2563eb">SIDEQUEST</text><text x="60" y="127" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="700" fill="#13243b">Follow your curiosity.</text><text x="60" y="182" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="700" fill="#13243b">Keep your main thread.</text><text x="62" y="225" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#63758d">Nested side conversations for DeepSeek Harness</text><text x="1140" y="65" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="600" fill="#718096">FEATURE ILLUSTRATION</text><rect x="45" y="268" width="1350" height="505" rx="22" fill="#fff" stroke="#dbe3ee"/><rect x="66" y="290" width="398" height="458" rx="15" fill="#f8fafc" stroke="none"/><text x="86" y="322" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">MAIN THREAD</text><text x="86" y="356" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" fill="#13243b">Your original question</text><rect x="480" y="290" width="398" height="458" rx="15" fill="#f8fafc" stroke="none"/><text x="500" y="322" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">SIDEQUEST 01</text><text x="500" y="356" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" fill="#13243b">Zoom in on one idea</text><rect x="894" y="290" width="398" height="458" rx="15" fill="#f8fafc" stroke="none"/><text x="914" y="322" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">SIDEQUEST 02</text><text x="914" y="356" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600" fill="#13243b">Ask one level deeper</text><rect x="86" y="382" width="358" height="66" rx="12" fill="#e9efff" stroke="none"/><text x="101" y="409" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">Explain why ln(x) is negative</text><text x="101" y="436" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">when 0 &lt; x &lt; 1.</text><text x="88" y="482" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">Think of ln(x) as the exponent</text><text x="88" y="509" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">you need to put on e.</text><text x="88" y="536" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">For inputs below 1, that exponent</text><text x="88" y="563" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">is negative.</text><rect x="87" y="588" width="355" height="39" rx="7" fill="#dbeafe" stroke="none"/><text x="100" y="613" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#174da3">“that exponent is negative”</text><rect x="199" y="643" width="243" height="42" rx="12" fill="#2563eb" stroke="none"/><text x="221" y="670" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#fff">Quote &amp; ask on the side</text><text x="87" y="720" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#718096">The main conversation stays in place.</text><rect x="500" y="382" width="358" height="66" rx="12" fill="#e9efff" stroke="none"/><text x="516" y="409" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">Why does a negative exponent</text><text x="516" y="436" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">make the result smaller than 1?</text><text x="502" y="482" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">A negative exponent means</text><text x="502" y="509" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">taking a reciprocal.</text><text x="502" y="536" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">For example, e⁻¹ = 1/e ≈ 0.368.</text><rect x="500" y="565" width="358" height="75" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="522" y="608" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600" fill="#13243b">e⁻¹ = 1/e &lt; 1</text><rect x="615" y="662" width="243" height="42" rx="12" fill="#2563eb" stroke="none"/><text x="638" y="689" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#fff">Ask another side question</text><rect x="914" y="382" width="358" height="66" rx="12" fill="#e9efff" stroke="none"/><text x="930" y="409" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">Can I explore that relationship</text><text x="930" y="436" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#4b5d75">with an interactive chart?</text><rect x="914" y="464" width="358" height="239" rx="12" fill="#fff" stroke="#dbe3ee"/><text x="932" y="491" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#13243b">y = ln(x)</text><path d="M 946 514 V 626 M 936 552 H 1250" stroke="#94a3b8" fill="none"/><path d="M 953 620 C 962 589, 985 568, 1032 552 S 1138 525, 1244 514" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="984" cy="574" r="6" fill="#2563eb"/><text x="1040" y="573" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#718096">1</text><text x="934" y="653" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#213047">x = 0.50    ln(x) ≈ −0.693</text><path d="M 935 679 H 1249" stroke="#dbeafe" stroke-width="6" stroke-linecap="round"/><circle cx="1006" cy="679" r="9" fill="#2563eb"/><text x="915" y="730" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#718096">Charts run right inside the side chat.</text><rect x="1310" y="410" width="58" height="216" rx="15" fill="#edf4ff" stroke="none"/><path d="M 1328 459 h 22 m -7 -7 l 7 7 -7 7" fill="none" stroke="#2563eb" stroke-width="2.5"/><text x="1325" y="518" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#2563eb">···</text><path d="M 1328 567 h 22 m -7 -7 l 7 7 -7 7" fill="none" stroke="#2563eb" stroke-width="2.5"/><text x="60" y="817" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#63758d">SELECT A PASSAGE</text><path d="M 290 810 h 22 m -7 -7 l 7 7 -7 7" fill="none" stroke="#2563eb" stroke-width="2.5"/><text x="335" y="817" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#63758d">ASK ON THE SIDE</text><path d="M 560 810 h 22 m -7 -7 l 7 7 -7 7" fill="none" stroke="#2563eb" stroke-width="2.5"/><text x="604" y="817" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#63758d">GO DEEPER</text><path d="M 800 810 h 22 m -7 -7 l 7 7 -7 7" fill="none" stroke="#2563eb" stroke-width="2.5"/><text x="844" y="817" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#63758d">RETURN TO YOUR MAIN THREAD</text></svg>