<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc"><title id="title">How SideQuest carries context</title><desc id="desc">Each side conversation inherits a snapshot of its ancestor path. Closing a pane discards that pane and its descendants. No fixed depth limit is imposed.</desc><rect x="0" y="0" width="1440" height="430" rx="20" fill="#0f1d32" stroke="none"/><text x="55" y="65" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">One question can open another.</text><text x="56" y="103" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" fill="#a5b6cf">Each side chat gets its ancestor context — without cluttering the main thread.</text><rect x="55" y="153" width="292" height="122" rx="15" fill="#1b304c" stroke="#324b6b"/><text x="77" y="190" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8cb9ff">MAIN THREAD</text><text x="77" y="228" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#fff">Original conversation</text><rect x="400" y="153" width="292" height="122" rx="15" fill="#1b304c" stroke="#324b6b"/><text x="422" y="190" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8cb9ff">SIDEQUEST 1</text><text x="422" y="228" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#fff">Question about a passage</text><rect x="745" y="153" width="292" height="122" rx="15" fill="#1b304c" stroke="#324b6b"/><text x="767" y="190" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#8cb9ff">SIDEQUEST 2</text><text x="767" y="228" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#fff">Question about the answer</text><path d="M 355 217 h 22 m -7 -7 l 7 7 -7 7" fill="none" stroke="#7faeff" stroke-width="2.5"/><path d="M 700 217 h 22 m -7 -7 l 7 7 -7 7" fill="none" stroke="#7faeff" stroke-width="2.5"/><path d="M 1045 217 h 22 m -7 -7 l 7 7 -7 7" fill="none" stroke="#7faeff" stroke-width="2.5"/><text x="1110" y="204" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#fff">Keep branching</text><text x="1110" y="237" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#a5b6cf">No fixed depth cap</text><text x="56" y="337" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#c4d1e4">Context is a snapshot of the ancestor path. Sibling chats are not included.</text><text x="56" y="375" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#c4d1e4">Close a side chat to discard it and its descendants. Main history stays intact.</text></svg>